    <!-- Estas etiquetas OG/Twitter son las que leen WhatsApp/Facebook/etc.
         al armar la vista previa de un link — NO ejecutan el JS de la app
         (BrandContext.jsx solo cambia el favicon del tab ya cargado), así
         que tienen que venir fijas en el HTML estático. Por eso Alas de
         Amara tiene su propio archivo (alas.html, mismo bundle/JS, solo
         cambia este shell) — ver vercel.json. -->
    <meta property="og:title" content="Free Soul DNA · Feedback" />
    <meta property="og:description" content="Curaduría de portafolio y encuestas de producto." />
    <meta property="og:image" content="https://free-soul-feedback-portafolio.vercel.app/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://free-soul-feedback-portafolio.vercel.app/icon-512.png" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
