<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f47878" />
    <link rel="icon" type="image/png" href="/brands/alas-de-amara/icon.png" />
    <link rel="apple-touch-icon" href="/brands/alas-de-amara/icon.png" />
    <title>Alas de Amara · Feedback</title>
    <!-- Shell estático para todo lo que vive bajo /alas — ver el comentario
         en index.html (el hermano de este archivo, para Free Soul). Carga
         exactamente el mismo bundle (/src/main.jsx); BrandContext.jsx
         detecta la marca por la URL igual que siempre. Este archivo solo
         existe para que el <title>/favicon/OG que lee WhatsApp (u otro
         crawler que no ejecuta JS) ya vengan con la marca correcta. -->
    <meta property="og:title" content="Alas de Amara · Feedback" />
    <meta property="og:description" content="Curaduría de portafolio y encuestas de producto — Vuela a tu manera." />
    <meta property="og:image" content="https://free-soul-feedback-portafolio.vercel.app/brands/alas-de-amara/icon.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://free-soul-feedback-portafolio.vercel.app/brands/alas-de-amara/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
